services:
  tunnbox:
    image: pgorbunov/tunnbox:latest
    container_name: tunnbox
    restart: unless-stopped

    # Minimal capabilities: NET_ADMIN for WireGuard/iptables, SYS_MODULE to load the kernel
    # module, MKNOD for /dev/net/tun when falling back to wireguard-go.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      - MKNOD
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.forwarding=1

    ports:
      # Web UI. Bind to 127.0.0.1:8000:8000 when running behind a reverse proxy.
      - "8000:8000"
      # WireGuard interfaces (one UDP port per interface)
      - "51820:51820/udp"
      - "51821:51821/udp"

    volumes:
      - ./data/wireguard:/etc/wireguard
      - ./data/app:/app/data
      - /lib/modules:/lib/modules:ro

    environment:
      # REQUIRED: public IP or hostname clients connect to (no port). Editable later in Settings.
      - WG_DEFAULT_ENDPOINT=${WG_DEFAULT_ENDPOINT:-}

      # Strongly recommended: a fixed secret (openssl rand -hex 32). If omitted, one is generated
      # on first start and persisted in ./data/app/.secret_key.
      - SECRET_KEY=${SECRET_KEY:-}

      # Defaults for new peers/interfaces (editable in Settings)
      - WG_DEFAULT_DNS=${WG_DEFAULT_DNS:-1.1.1.1}

      # Session lifetimes
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # Security. PostUp/PostDown run as root inside the container; keep disabled unless you need it.
      - WG_ALLOW_CUSTOM_SCRIPTS=${WG_ALLOW_CUSTOM_SCRIPTS:-false}
      # Comma-separated IPs/CIDRs of reverse proxies allowed to set X-Forwarded-For / X-Forwarded-Proto.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # auto (Secure cookies when served over HTTPS), true or false
      - COOKIE_SECURE=${COOKIE_SECURE:-auto}

      # Use the wireguard-go userspace implementation when the kernel module is unavailable (WSL2, some VPS).
      - WG_I_PREFER_BUGGY_USERSPACE_TO_POLISHED_KERNEL=1

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
